<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质感之家 Logo - 炫酷动效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffffff 0%, #d5ecf9 50%, #ffffff 100%);
            margin: 0;
            font-family: 'Source Han Sans CN', 'Noto Sans SC', 'Mi Sans', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #a2c5d6;
            border-radius: 50%;
            opacity: 0.3;
            animation: particleFloat 15s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .initial-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d5ecf9;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: initialFadeOut 0.6s ease-out 1.2s forwards;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loader-dots {
            display: flex;
            gap: 10px;
        }

        .loading-dot {
            width: 15px;
            height: 15px;
            background-color: #89a5b5;
            border-radius: 50%;
            opacity: 0;
            animation: loadingDots 1.2s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(137, 165, 181, 0.5);
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loadingDots {
            0%, 80%, 100% { 
                opacity: 0; 
                transform: scale(0.5);
            }
            40% { 
                opacity: 1; 
                transform: scale(1.2);
            }
        }

        @keyframes initialFadeOut {
            to { 
                opacity: 0; 
                visibility: hidden;
            }
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            opacity: 0;
            animation: fadeInLogoContainerElement 0.8s ease-out 1.3s forwards;
            position: relative;
            z-index: 10;
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(137, 165, 181, 0.3) 0%, transparent 70%);
            animation: pulseGlow 3s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        .logo-image {
            width: 250px;
            height: 250px;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: scale(0.3) rotateY(180deg);
            animation: logoAppear 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) 1.5s forwards;
            filter: drop-shadow(0 10px 30px rgba(137, 165, 181, 0.3));
        }

        @keyframes logoAppear {
            0% { 
                opacity: 0; 
                transform: scale(0.3) rotateY(180deg);
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotateY(0deg);
            }
        }

        .logo-text-z-squircle {
            font-size: 32px;
            font-weight: 600;
            color: #3a4a5f;
            letter-spacing: 3px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUpTextElementSquircle 0.8s ease-out 2.5s forwards;
        }

        .logo-tagline-z-squircle {
            font-size: 14px;
            color: #89a5b5;
            margin-top: 15px;
            font-weight: 400;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUpTextElementSquircle 0.8s ease-out 2.9s forwards;
        }

        @keyframes fadeInLogoContainerElement {
            to { 
                opacity: 1; 
            }
        }

        @keyframes fadeInUpTextElementSquircle {
            from { 
                transform: translateY(20px); 
                opacity: 0;
            }
            to { 
                transform: translateY(0); 
                opacity: 1;
            }
        }

        .enter-progress {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 3.2s forwards;
            z-index: 10;
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(137, 165, 181, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #a2c5d6, #89a5b5);
            border-radius: 2px;
            animation: progressFill 0.8s ease-out 3.3s forwards;
        }

        @keyframes progressFill {
            to {
                width: 100%;
            }
        }

        .enter-text {
            font-size: 12px;
            color: #89a5b5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

    </style>
</head>
<body>
    <div class="particle-bg" id="particles"></div>

    <div class="initial-loader">
        <div class="loader-content">
            <div class="loader-dots">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        </div>
    </div>

    <div class="logo-container">
        <div class="logo-wrapper">
            <div class="glow-ring"></div>
            <img src="file:///C:/Users/23344/Desktop/guanwnag - 副本/zgzj（logo版官网）/zgzj/images/logo.png" alt="质感之家 Logo" class="logo-image">
        </div>
        <div class="logo-text-z-squircle">质感之家</div>
        <div class="logo-tagline-z-squircle">简约生活 · 智能相伴</div>
    </div>

    <div class="enter-progress">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="enter-text">正在进入</div>
    </div>

    <script>
        // 创建粒子背景
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particle.style.width = (4 + Math.random() * 6) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        createParticles();

        setTimeout(function() {
            window.location.href = 'zgzj（logo版官网）/zgzj/index.html';
        }, 4000);
    </script>

</body>
</html>
